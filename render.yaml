services:
  - type: web
    name: field-management-preview
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: AUTH_SECURE_COOKIE
        value: "true"
